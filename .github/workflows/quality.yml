name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "forge/**"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_SUPABASE_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate cloud bootstrap shell syntax
        run: bash -n ops/free-cloud/oci-bootstrap.sh
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint changed TypeScript and JavaScript files
        shell: bash
        run: |
          bunx eslint --rule 'prettier/prettier: off' src/lib/accounts.ts src/lib/deployment-env.ts src/lib/deployment-quality.ts src/lib/github.server.ts src/lib/project-sync-github-adapter.server.ts src/lib/project-sync-executor.server.ts src/test/project-sync-github-adapter.test.ts src/test/project-sync-executor.test.ts
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
